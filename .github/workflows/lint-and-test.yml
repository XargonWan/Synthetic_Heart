name: Lint and Test

on:
  push:
    branches: [ develop, feat/** ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Node deps
        run: npm ci
      - name: Run JS/HTML lint
        run: npm run lint:webui

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      webui:
        image: node:18
        options: >-
          --entrypoint 'bash -c' -e "python -u scripts/run_webui.py & sleep 1; tail -f /dev/null"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright E2E
        run: npx playwright test tests/e2e --timeout=120000 || true
