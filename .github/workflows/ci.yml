name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install deps (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Syntax check (compile all .py files)
        run: |
          python - <<'PY'
import py_compile, glob, sys
files = glob.glob('**/*.py', recursive=True)
failed = []
for f in files:
    try:
        py_compile.compile(f, doraise=True)
    except Exception as e:
        print(f'ERROR: {f} -> {e}')
        failed.append(f)
if failed:
    print('Some files failed syntax check')
    sys.exit(1)
print('All python files compiled')
PY

  mypy:
    runs-on: ubuntu-latest
    needs: syntax
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install mypy
      - name: Run mypy (non-blocking)
        run: |
          python -m mypy --config-file mypy.ini || true

  pytest:
    runs-on: ubuntu-latest
    needs: syntax
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest || true
      - name: Run pytest (non-blocking)
        run: |
          pytest -q || true
