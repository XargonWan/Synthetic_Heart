name: "Synthetic Heart - Release"

on:
  push:
    branches:
      - "main"
      - "develop"
      - "fix/**"
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "fix/**"
      - "feat/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the Windows installer to a GitHub Release"
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.gitversion.outputs.majorMinorPatch }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.14
        with:
          versionSpec: '5.x'
      - name: Determine version with GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.14
        with:
          useConfigFile: true
      # The installer needs one version, and two sources can disagree about it: a tag
      # is a person stating what this build is called, while GitVersion guesses the
      # next version from the commits. On a tag push the tag wins, so a release can
      # never be tagged v1.0.16 and hand out SyntH-Setup-1.1.0.exe.
      - name: Decide the version this run builds
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ steps.gitversion.outputs.majorMinorPatch }}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::$version from ${GITHUB_REF_NAME} is not a semantic version"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref ${GITHUB_REF_NAME} -> SyntH-Setup-$version.exe"

  build-images:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/synthetic_heart
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GITVERSION_TAG=${{ needs.prepare.outputs.semver }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export digest
        run: |
          echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.arch }}
          echo "Digest for ${{ matrix.arch }}: ${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}

  unit-tests:
    needs: build-images
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy env file
        run: |
          echo "BOTFATHER_TOKEN=dummy" >> .env
          echo "OPENAI_API_KEY=dummy" >> .env
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Run unit tests
        id: tests
        run: ./run_tests.sh
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

  agent-integration:
    needs: unit-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: synth
          MYSQL_USER: synth
          MYSQL_PASSWORD: synth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=2s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          # dependencies are managed via pyproject.toml/uv.lock
          python -m pip install uv
          uv sync --no-cache
          pip install pytest pytest-asyncio aiomysql
      - name: Wait for mysql
        run: |
          for i in {1..20}; do mysql -h127.0.0.1 -uroot -proot -e "SELECT 1" && break || sleep 3; done
      - name: Run agent tests
        run: pytest -q tests/test_agent_loop.py -q tests/test_recon_debrief.py -q tests/test_agent_webui.py -q tests/test_agent_attach.py

  agent-e2e:
    needs: agent-integration
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: synth
          MYSQL_USER: synth
          MYSQL_PASSWORD: synth
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=2s --health-retries=20
      zen:
        image: zen/standalone-chrome:115.0
        ports:
          - 4444:4444
        options: >-
          --health-cmd="curl -sS http://localhost:4444/status | grep -q 'ready' || exit 1"
          --health-interval=5s --health-timeout=2s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install uv
          uv sync --no-cache
          pip install pytest pytest-asyncio zen
      - name: Wait for services
        run: |
          for i in {1..30}; do mysql -h127.0.0.1 -uroot -proot -e "SELECT 1" && curl -sS http://localhost:4444/status | grep -q 'ready' && break || sleep 3; done
      - name: Run end-to-end agent tests
        run: pytest -q tests/test_engine_adapters.py -q tests/test_zen_queue.py -q tests/test_agent_loop.py

  mypy-check:
    needs: unit-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install mypy
        run: python -m pip install mypy
      - name: Run mypy
        run: python -m mypy . --strict

  have-dockerhub:
    # A fork does not inherit this repository's secrets, so the jobs that push to Docker
    # Hub cannot succeed there. Asking once, here, keeps `manifest` (the only job whose
    # failure fails the whole run) from turning every fork run red for a reason that is
    # not code. Where the secret exists, nothing about the run changes.
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME is not set for this repository, so the image manifest is skipped"
          fi

  manifest:
    needs: [prepare, build-images, have-dockerhub]
    if: needs.have-dockerhub.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/synthetic_heart
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: digest-amd64
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: digest-arm64
          path: .
        continue-on-error: true
      - name: Read digests
        id: digests
        run: |
          missing=""
          have_one="false"
          if [ -f digest-amd64 ]; then
            echo "amd64=$(cat digest-amd64)" >> "$GITHUB_OUTPUT"
            echo "AMD64 digest: $(cat digest-amd64)"
            have_one="true"
          else
            echo "::warning::digest-amd64 missing, will skip amd64 in manifest"
            missing="amd64"
          fi
          if [ -f digest-arm64 ]; then
            echo "arm64=$(cat digest-arm64)" >> "$GITHUB_OUTPUT"
            echo "ARM64 digest: $(cat digest-arm64)"
            have_one="true"
          else
            echo "::warning::digest-arm64 missing, will skip arm64 in manifest"
            missing="$missing arm64"
          fi
          if [ "$have_one" = "false" ]; then
            echo "::error::No digests available, cannot create any manifest. Failing job."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::warning::Some digests are missing: $missing"
          fi
      - name: Compute image tags
        id: meta
        env:
          SEMVER: ${{ needs.prepare.outputs.semver }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE_NAME="$IMAGE_NAME"
          tags=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tags="$IMAGE_NAME:pr$PR_NUMBER-$SEMVER"
          elif [ "$REF_NAME" = "main" ]; then
            tags="$IMAGE_NAME:$SEMVER,$IMAGE_NAME:latest"
          elif [ "$REF_NAME" = "develop" ]; then
            tags="$IMAGE_NAME:develop-$SEMVER,$IMAGE_NAME:latest-develop"
          else
            sanitized=$(echo "$REF_NAME" | tr '/' '-')
            tags="$IMAGE_NAME:$sanitized-$SEMVER"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Generated tags: $tags"
      - name: Create multi-arch manifest
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            args=""
            if [ -n "$AMD64_DIGEST" ]; then
              args="$args $IMAGE_NAME@$AMD64_DIGEST"
            fi
            if [ -n "$ARM64_DIGEST" ]; then
              args="$args $IMAGE_NAME@$ARM64_DIGEST"
            fi
            if [ -z "$args" ]; then
              echo "::error::No digests available for manifest $tag, skipping."
              continue
            fi
            echo "Creating manifest for tag: $tag with: $args"
            docker buildx imagetools create -t "$tag" $args
            echo "✅ Created manifest for $tag"
          done

  cleanup-images:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [manifest, unit-tests]
    continue-on-error: true
    steps:
      - name: Remove dangling and old PR images from Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          repo="$USERNAME/synthetic_heart"
          
          # Get auth token
          token_response=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$USERNAME\", \"password\": \"$PASSWORD\"}" \
            https://hub.docker.com/v2/users/login/)
          
          token=$(echo "$token_response" | jq -r '.token // empty')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::warning::Failed to authenticate with Docker Hub API"
            exit 0
          fi

          # Delete untagged images
          echo "🧹 Cleaning up untagged images..."
          curl -s -H "Authorization: JWT $token" "https://hub.docker.com/v2/repositories/$repo/images?page_size=100" | \
            jq -r '.results[]? | select((.digest != null) and (.tags | length == 0)) | .digest' | while read digest; do
              if [ -n "$digest" ]; then
                echo "Deleting dangling image $digest"
                curl -s -H "Authorization: JWT $token" -X DELETE "https://hub.docker.com/v2/repositories/$repo/images/$digest/" || true
              fi
            done

          # Delete PR tags older than two weeks
          echo "🧹 Cleaning up old PR tags..."
          cutoff=$(date -u -d '14 days ago' +%s)
          curl -s -H "Authorization: JWT $token" "https://hub.docker.com/v2/repositories/$repo/tags?page_size=100" | \
            jq -r '.results[]? | .name + " " + .last_updated' | while read name updated; do
              if [[ "$name" == pr* ]] && [ -n "$updated" ]; then
                ts=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
                if [ $ts -lt $cutoff ] && [ $ts -gt 0 ]; then
                  echo "Deleting tag $name (older than two weeks)"
                  curl -s -H "Authorization: JWT $token" -X DELETE "https://hub.docker.com/v2/repositories/$repo/tags/$name/" || true
                fi
              fi
            done
          
          echo "✅ Cleanup completed"

  windows-installer:
    # The one-click installer for Windows, built from the same tree the tests
    # just ran against.
    #
    # Not on pull requests: it downloads ~320 MB of PostgreSQL binaries per
    # architecture and takes several minutes. Installer breakage surfaces on
    # develop, where a human is looking, instead of on every PR.
    #
    # pgvector is built here rather than downloaded from the other workflow so
    # this job is self-contained: pgvector publishes no prebuilt Windows
    # binaries, and the DLL must be linked against the exact PostgreSQL build
    # the installer unpacks. See installer/vendor/README.md.
    if: github.event_name != 'pull_request'
    needs: [prepare]
    runs-on: windows-latest
    env:
      PGVECTOR_TAG: v0.8.6
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build pgvector for the bundled PostgreSQL
        shell: pwsh
        run: |
          $matrix = [ordered]@{ '16' = '16.10-1'; '17' = '17.6-1' }
          $ProgressPreference = 'SilentlyContinue'
          foreach ($major in $matrix.Keys) {
            $release = $matrix[$major]
            $zip = Join-Path $env:RUNNER_TEMP "pg$major.zip"
            Write-Host "::group::PostgreSQL $release binaries"
            Invoke-WebRequest -Uri "https://get.enterprisedb.com/postgresql/postgresql-$release-windows-x64-binaries.zip" -OutFile $zip
            $dest = Join-Path $env:RUNNER_TEMP "pg$major"
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $pgRoot = Join-Path $dest 'pgsql'
            if (-not (Test-Path (Join-Path $pgRoot 'include\server\postgres.h'))) {
              throw "the PostgreSQL $major archive has no server headers; pgvector cannot be built against it"
            }

            $src = Join-Path $env:RUNNER_TEMP "pgvector-$major"
            git clone --branch $env:PGVECTOR_TAG --depth 1 https://github.com/pgvector/pgvector.git $src
            Push-Location $src
            $env:PGROOT = $pgRoot
            cmd /c "nmake /F Makefile.win"
            if ($LASTEXITCODE -ne 0) { throw "nmake failed for PostgreSQL $major" }
            cmd /c "nmake /F Makefile.win install"
            if ($LASTEXITCODE -ne 0) { throw "nmake install failed for PostgreSQL $major" }
            Pop-Location

            $vendor = "installer/vendor/pgvector/pg$major"
            New-Item -ItemType Directory -Force -Path $vendor | Out-Null
            Copy-Item (Join-Path $pgRoot 'lib\vector.dll') $vendor
            Copy-Item (Join-Path $pgRoot 'share\extension\vector.control') $vendor
            Copy-Item (Join-Path $pgRoot 'share\extension\vector--*.sql') $vendor
            $dll = Get-Item (Join-Path $vendor 'vector.dll')
            if ($dll.Length -lt 100kb) { throw "vector.dll for PostgreSQL $major is only $($dll.Length) bytes" }
            Get-ChildItem $vendor | Select-Object Name, Length | Format-Table -AutoSize
            Write-Host "::endgroup::"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Write-Host "building SyntH $env:VERSION"
          ./installer/build_installer.ps1 -Version $env:VERSION -SkipVendorWarning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: SyntH-Setup-${{ needs.prepare.outputs.version }}-windows-x64
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # The step that was missing: every push already builds the installer and leaves it
    # as a workflow artifact, where it expires and nobody can find it. This attaches
    # that same executable to a GitHub Release.
    #
    # Only for a version tag (v1.0.16) or a manual run that asked for it: a release on
    # every push to develop would be noise. A manual run has no tag yet, so the release
    # creates v<version> at the commit the run was dispatched on.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [prepare, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the installer this run built
        uses: actions/download-artifact@v4
        with:
          name: SyntH-Setup-${{ needs.prepare.outputs.version }}-windows-x64
          path: dist

      - name: Check it is a complete installer before publishing it
        run: |
          set -euo pipefail
          ls -l dist
          shopt -s nullglob
          installers=(dist/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::no installer was downloaded, so there is nothing to publish"
            exit 1
          fi
          for exe in "${installers[@]}"; do
            size=$(stat -c%s "$exe")
            echo "$exe is $size bytes"
            # A published asset is what strangers download, and it cannot be quietly
            # corrected afterwards, so refuse anything obviously truncated.
            if [ "$size" -lt 20000000 ]; then
              echo "::error::$exe is only $size bytes, which is not a whole installer"
              exit 1
            fi
          done
          # Bare file names, so downloading the installer and this file into one folder
          # leaves a plain `sha256sum -c SHA256SUMS` working.
          (cd dist && sha256sum -- *.exe > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.prepare.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.prepare.outputs.version) }}
          files: |
            dist/*.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
