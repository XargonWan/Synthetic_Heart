name: "Synthetic Heart - Release"

# Every push publishes the images, tagged with the version scripts/version.py computes from
# the conventional commits. On main that is the plain version (1.31.0) plus "latest"; on any
# other branch the version carries the branch name (1.31.0-feat-retroxr) and never "latest",
# so a branch can be tried without touching what main users pull. Pull requests only build,
# to catch breakage.
# Releases are another matter, and only two branches have them:
#   main     a valid release v<version> with the Windows installer. The tag it creates is what
#            the next release counts its version and notes from.
#   develop  one rolling pre-release, tag latest-develop, deleted and made again on every push
#            so it always holds the newest installer and nothing older. It is never "latest" and
#            its tag is not a vX.Y.Z, so it never counts as a release.
# Any other branch publishes no release (its installer stays a workflow artifact).
# The body is written by scripts/release_notes.py from the commits since the previous release.
# See docs/contributing.rst ("Releases").

on:
  push:
    branches:
      - "main"
      - "develop"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "fix/**"
      - "feat/**"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gv.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version script needs the full history and its tags
      # One source for the version: the conventional commits since the last release tag.
      # Every consumer below (image tags, installer name, release tag) reads this output.
      - id: gv
        run: python3 scripts/version.py

  build-images:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/synthetic_heart
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GITVERSION_TAG=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export digest
        run: |
          echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.arch }}
          echo "Digest for ${{ matrix.arch }}: ${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}

  unit-tests:
    needs: build-images
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy env file
        run: |
          echo "BOTFATHER_TOKEN=dummy" >> .env
          echo "OPENAI_API_KEY=dummy" >> .env
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Run unit tests
        id: tests
        run: ./run_tests.sh
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

  mypy-check:
    needs: unit-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install mypy
        run: python -m pip install mypy
      - name: Run mypy
        # Scope and strictness come from mypy.ini (`files`); `mypy . --strict` over the
        # whole repo has thousands of pre-existing findings and says nothing about a change.
        run: python -m mypy

  have-dockerhub:
    # A fork does not inherit this repository's secrets, so the jobs that push to Docker
    # Hub cannot succeed there. Asking once, here, keeps `manifest` (the only job whose
    # failure fails the whole run) from turning every fork run red for a reason that is
    # not code. Where the secret exists, nothing about the run changes.
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME is not set for this repository, so the image manifest is skipped"
          fi

  manifest:
    needs: [prepare, build-images, have-dockerhub]
    if: needs.have-dockerhub.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/synthetic_heart
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: digest-amd64
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: digest-arm64
          path: .
        continue-on-error: true
      - name: Read digests
        id: digests
        run: |
          missing=""
          have_one="false"
          if [ -f digest-amd64 ]; then
            echo "amd64=$(cat digest-amd64)" >> "$GITHUB_OUTPUT"
            echo "AMD64 digest: $(cat digest-amd64)"
            have_one="true"
          else
            echo "::warning::digest-amd64 missing, will skip amd64 in manifest"
            missing="amd64"
          fi
          if [ -f digest-arm64 ]; then
            echo "arm64=$(cat digest-arm64)" >> "$GITHUB_OUTPUT"
            echo "ARM64 digest: $(cat digest-arm64)"
            have_one="true"
          else
            echo "::warning::digest-arm64 missing, will skip arm64 in manifest"
            missing="$missing arm64"
          fi
          if [ "$have_one" = "false" ]; then
            echo "::error::No digests available, cannot create any manifest. Failing job."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::warning::Some digests are missing: $missing"
          fi
      - name: Compute image tags
        id: meta
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE_NAME="$IMAGE_NAME"
          # The version already carries the branch name when it is not main's.
          tags=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tags="$IMAGE_NAME:pr$PR_NUMBER-$VERSION"
          elif [ "$REF_NAME" = "main" ]; then
            tags="$IMAGE_NAME:$VERSION,$IMAGE_NAME:latest"
          elif [ "$REF_NAME" = "develop" ]; then
            tags="$IMAGE_NAME:$VERSION,$IMAGE_NAME:latest-develop"
          else
            tags="$IMAGE_NAME:$VERSION"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Generated tags: $tags"
      - name: Create multi-arch manifest
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            args=""
            if [ -n "$AMD64_DIGEST" ]; then
              args="$args $IMAGE_NAME@$AMD64_DIGEST"
            fi
            if [ -n "$ARM64_DIGEST" ]; then
              args="$args $IMAGE_NAME@$ARM64_DIGEST"
            fi
            if [ -z "$args" ]; then
              echo "::error::No digests available for manifest $tag, skipping."
              continue
            fi
            echo "Creating manifest for tag: $tag with: $args"
            docker buildx imagetools create -t "$tag" $args
            echo "✅ Created manifest for $tag"
          done

  cleanup-images:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [manifest, unit-tests]
    continue-on-error: true
    steps:
      - name: Remove dangling and old PR images from Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          repo="$USERNAME/synthetic_heart"
          
          # Get auth token
          token_response=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$USERNAME\", \"password\": \"$PASSWORD\"}" \
            https://hub.docker.com/v2/users/login/)
          
          token=$(echo "$token_response" | jq -r '.token // empty')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::warning::Failed to authenticate with Docker Hub API"
            exit 0
          fi

          # Delete untagged images
          echo "🧹 Cleaning up untagged images..."
          curl -s -H "Authorization: JWT $token" "https://hub.docker.com/v2/repositories/$repo/images?page_size=100" | \
            jq -r '.results[]? | select((.digest != null) and (.tags | length == 0)) | .digest' | while read digest; do
              if [ -n "$digest" ]; then
                echo "Deleting dangling image $digest"
                curl -s -H "Authorization: JWT $token" -X DELETE "https://hub.docker.com/v2/repositories/$repo/images/$digest/" || true
              fi
            done

          # Delete PR tags older than two weeks
          echo "🧹 Cleaning up old PR tags..."
          cutoff=$(date -u -d '14 days ago' +%s)
          curl -s -H "Authorization: JWT $token" "https://hub.docker.com/v2/repositories/$repo/tags?page_size=100" | \
            jq -r '.results[]? | .name + " " + .last_updated' | while read name updated; do
              if [[ "$name" == pr* ]] && [ -n "$updated" ]; then
                ts=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
                if [ $ts -lt $cutoff ] && [ $ts -gt 0 ]; then
                  echo "Deleting tag $name (older than two weeks)"
                  curl -s -H "Authorization: JWT $token" -X DELETE "https://hub.docker.com/v2/repositories/$repo/tags/$name/" || true
                fi
              fi
            done
          
          echo "✅ Cleanup completed"

  windows-installer:
    # The one-click installer for Windows, built from the same tree the tests
    # just ran against.
    #
    # Not on pull requests: it downloads ~320 MB of PostgreSQL binaries per
    # architecture and takes several minutes. Installer breakage surfaces on
    # develop, where a human is looking, instead of on every PR.
    #
    # pgvector is built here rather than downloaded from the other workflow so
    # this job is self-contained: pgvector publishes no prebuilt Windows
    # binaries, and the DLL must be linked against the exact PostgreSQL build
    # the installer unpacks. See installer/vendor/README.md.
    if: github.event_name != 'pull_request'
    needs: [prepare]
    runs-on: windows-latest
    env:
      PGVECTOR_TAG: v0.8.6
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build pgvector for the bundled PostgreSQL
        shell: pwsh
        run: |
          $matrix = [ordered]@{ '16' = '16.10-1'; '17' = '17.6-1' }
          $ProgressPreference = 'SilentlyContinue'
          foreach ($major in $matrix.Keys) {
            $release = $matrix[$major]
            $zip = Join-Path $env:RUNNER_TEMP "pg$major.zip"
            Write-Host "::group::PostgreSQL $release binaries"
            Invoke-WebRequest -Uri "https://get.enterprisedb.com/postgresql/postgresql-$release-windows-x64-binaries.zip" -OutFile $zip
            $dest = Join-Path $env:RUNNER_TEMP "pg$major"
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $pgRoot = Join-Path $dest 'pgsql'
            if (-not (Test-Path (Join-Path $pgRoot 'include\server\postgres.h'))) {
              throw "the PostgreSQL $major archive has no server headers; pgvector cannot be built against it"
            }

            $src = Join-Path $env:RUNNER_TEMP "pgvector-$major"
            git clone --branch $env:PGVECTOR_TAG --depth 1 https://github.com/pgvector/pgvector.git $src
            Push-Location $src
            $env:PGROOT = $pgRoot
            cmd /c "nmake /F Makefile.win"
            if ($LASTEXITCODE -ne 0) { throw "nmake failed for PostgreSQL $major" }
            cmd /c "nmake /F Makefile.win install"
            if ($LASTEXITCODE -ne 0) { throw "nmake install failed for PostgreSQL $major" }
            Pop-Location

            $vendor = "installer/vendor/pgvector/pg$major"
            New-Item -ItemType Directory -Force -Path $vendor | Out-Null
            Copy-Item (Join-Path $pgRoot 'lib\vector.dll') $vendor
            Copy-Item (Join-Path $pgRoot 'share\extension\vector.control') $vendor
            Copy-Item (Join-Path $pgRoot 'share\extension\vector--*.sql') $vendor
            $dll = Get-Item (Join-Path $vendor 'vector.dll')
            if ($dll.Length -lt 100kb) { throw "vector.dll for PostgreSQL $major is only $($dll.Length) bytes" }
            Get-ChildItem $vendor | Select-Object Name, Length | Format-Table -AutoSize
            Write-Host "::endgroup::"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Write-Host "building SyntH $env:VERSION"
          ./installer/build_installer.ps1 -Version $env:VERSION -SkipVendorWarning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: SyntH-Setup-${{ needs.prepare.outputs.version }}-windows-x64
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # main publishes v<version>; develop republishes the rolling pre-release. Nothing else
    # does, and a pull request only builds. The images are published by `manifest`, which a
    # fork skips (no Docker Hub secret); the release waits for it but does not need it.
    if: >-
      ${{ !cancelled()
      && github.event_name != 'pull_request'
      && (github.ref_name == 'main' || github.ref_name == 'develop')
      && needs.windows-installer.result == 'success'
      && (needs.manifest.result == 'success' || needs.manifest.result == 'skipped') }}
    needs: [prepare, windows-installer, manifest]
    runs-on: ubuntu-latest
    # Two pushes in a row must not delete and recreate the same release at once.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # The tag of the release: the version for main, a fixed name for the rolling one.
      RELEASE_TAG: ${{ github.ref_name == 'main' && format('v{0}', needs.prepare.outputs.version) || 'latest-develop' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes need the full history and its tags

      - name: Fetch the installer this run built
        uses: actions/download-artifact@v4
        with:
          name: SyntH-Setup-${{ needs.prepare.outputs.version }}-windows-x64
          path: dist

      - name: Check it is a complete installer before publishing it
        run: |
          set -euo pipefail
          ls -l dist
          shopt -s nullglob
          installers=(dist/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::no installer was downloaded, so there is nothing to publish"
            exit 1
          fi
          for exe in "${installers[@]}"; do
            size=$(stat -c%s "$exe")
            echo "$exe is $size bytes"
            # A published asset is what strangers download, and it cannot be quietly
            # corrected afterwards, so refuse anything obviously truncated.
            if [ "$size" -lt 20000000 ]; then
              echo "::error::$exe is only $size bytes, which is not a whole installer"
              exit 1
            fi
          done
          # Bare file names, so downloading the installer and this file into one folder
          # leaves a plain `sha256sum -c SHA256SUMS` working.
          (cd dist && sha256sum -- *.exe > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes
        run: |
          cp .github/release-header.md header.md
          if [ "${{ github.ref_name }}" != "main" ]; then
            {
              echo '> **Rolling pre-release.** This is the newest build of `develop`, replaced on every push. It is not a stable release: use it to try what is coming, and expect it to break.'
              echo
              cat .github/release-header.md
            } > header.md
          fi
          python3 scripts/release_notes.py --repo "${{ github.repository }}" --version "${{ needs.prepare.outputs.version }}" \
            --header header.md --body RELEASE.md

      - name: Remove the previous rolling pre-release
        # Its assets are named after the version, so updating it in place would pile them up,
        # and a tag that already exists is never moved. Deleting both lets the next step make
        # the release again at this commit.
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name == 'main' && format('Synthetic Heart v{0}', needs.prepare.outputs.version) || format('Synthetic Heart develop (v{0})', needs.prepare.outputs.version) }}
          draft: false
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          body_path: RELEASE.md
          files: |
            dist/*.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
