name: Docker smoke tests

on:
  push:
    branches: ["develop", "main"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image
        run: |
          docker build -t synth-smoke-test:${{ github.sha }} .

      - name: Run uvicorn import check
        run: |
          chmod +x ./scripts/check_image_uvicorn.sh
          ./scripts/check_image_uvicorn.sh synth-smoke-test:${{ github.sha }}
