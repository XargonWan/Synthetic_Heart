name: Auto Draft PR for windows-automation branches

on:
  push:
    branches:
      - 'windows-automation/**'

jobs:
  create-draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'WIP: Windows support automation'
          title: 'WIP: Windows support automation'
          body: |
            This is an automated draft PR created for the `windows-automation/*` branch.
            It contains Windows docs, a PowerShell start helper, and CI tweaks to support native runs.
          base: main
          draft: true
