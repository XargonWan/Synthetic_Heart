schema = 1

[extension]
id = "official/telegram_bot"
name = "Telegram Bot"
version = "0.1.0"
description = "Chat with SyntH through a Telegram bot (BotFather token)."
author = "SyntH"
experimental = true

[compat]
core_api = ">=0.1,<1"

[entry]
module = "ext_main"
function = "main"

[[provides.interfaces]]
id = "telegram_bot"
paths = ["telegram_bot/{chat}[/{thread}]"]
# What the Core may assume about this platform.
voice_input_tts_only = true       # speech only for spoken messages
negative_chat_id_is_group = true  # group ids are negative, private ids positive
bot_username_suffix = "bot"       # Telegram bot usernames end in "bot"
peer_ids = true                   # SYNTH_PEERS ids are Telegram user ids
speech_as_media = true            # a spoken reply is sent as a voice note

[permissions]
capabilities = ["log", "config", "stats", "interfaces.register", "interfaces.inbound"]
network = ["api.telegram.org:443"]

[python]
requirements = ["python-telegram-bot==22.6"]

[config.BOTFATHER_TOKEN]
type = "string"
label = "Bot token"
description = "Token from @BotFather."
sensitive = true
required = true

[config.TELEGRAM_API_URL]
type = "string"
label = "Bot API server"
description = "Base URL of the Bot API server (change it only for a local Bot API server)."
default = "https://api.telegram.org"

[config.POLL_TIMEOUT]
type = "int"
label = "Long-poll seconds"
default = 30
