<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
<style>
  html, body { margin: 0; min-height: 100%; background: var(--bg, #0d0d16); color: var(--text, #f5f5ff);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: 12px 16px; box-sizing: border-box; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--surface, rgba(24,24,36,.9)); border: 1px solid var(--border, rgba(255,255,255,.08));
    border-radius: 12px; margin-bottom: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #ef4444; }
  .dot.online { background: #22c55e; }
  .grow { margin-left: auto; }
  button { background: var(--accent, #6bfefe); color: var(--accent-contrast, #07070c); border: 0;
    border-radius: 8px; padding: 4px 12px; font-size: .85rem; cursor: pointer; }
  .entry { padding: 12px 16px; margin-bottom: 12px; background: var(--surface, rgba(24,24,36,.9));
    border: 1px solid var(--border, rgba(255,255,255,.08)); border-radius: 12px; }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--text-soft, #b9badc); font-size: .85rem; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: .75em; background: var(--accent, #6bfefe);
    color: var(--accent-contrast, #07070c); }
  .badge.bad { background: var(--error, #ff7b93); }
  .track { font-weight: 600; margin: 6px 0 4px; }
  .banter { white-space: pre-wrap; word-break: break-word; color: var(--text-soft, #b9badc); line-height: 1.5; }
  audio { width: 100%; max-width: 480px; height: 36px; margin-top: 10px; }
  .empty, .setup { text-align: center; padding: 40px 20px; color: var(--text-soft, #b9badc); }
  .setup { max-width: 600px; margin: 24px auto; background: var(--surface, rgba(24,24,36,.9));
    border-radius: 12px; }
  .setup ol { text-align: left; line-height: 1.7; }
</style>
<script src="theme.js"></script>
</head>
<body>
<div id="root"><div class="empty">Loading radio activity…</div></div>
<script src="radio.js"></script>
</body>
</html>
