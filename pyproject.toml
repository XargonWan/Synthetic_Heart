[project]
name = "synthetic-heart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp<3.10",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.17.0",
    "asyncpraw>=7.8.1",
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.4",
    "discord-py>=2.6.4",
    "fastapi>=0.128.0",
    "google-genai>=1.61.0",
    "jinja2>=3.1.6",
    "lxml>=6.0.2",
    "matrix-nio<0.25",
    "openai>=2.16.0",
    "praw>=7.8.1",
    "pycryptodome>=3.23.0",
    "pydantic>=2.12.5",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "python-telegram-bot>=22.6",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "selenium>=4.40.0",
    "selenium-stealth>=1.0.6",
    "telethon>=1.42.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.2",
    "tzdata>=2025.3",
    "undetected-chromedriver>=3.5.5",
    "uvicorn>=0.40.0",
    "watchfiles>=1.1.1",
    "websockets>=15.0.1",
    "webdriver-manager>=4.0.1",
    "setuptools>=70.0.0",
    "discord-ext-voice-recv>=0.5.2a179",
    # Auris/Vox default audio engines (packages that exist on PyPI and build cleanly)
    "vosk>=0.3.45",                    # local STT; model downloaded at runtime
    "silero-vad>=5.1",                # real-time VAD service (core/vad_service)
    "torch>=2.0",                     # required by silero-vad & qwen3tts
    "transformers>=4.40",             # required by qwen3tts Vox engine
    "soundfile>=0.12",                # audio I/O for qwen3tts
    "omegaconf>=2.3",                 # required by Silero TTS (kitten engine)
    # chatterbox-tts: depends on pkuseg which has build issues – install manually
    # harmony-speech-engine: not on PyPI – install manually from GitHub
    # kittentts: not yet on PyPI – install manually
    "pydub>=0.25.1",
    "huggingface-hub>=1.5.0",
    "gtts>=2.5.4",
    "edge-tts>=7.2.7",
]

[project.optional-dependencies]
# Install one or more extras to enable the corresponding audio engine.
# Example: uv pip install '.[silero]' or uv pip install '.[vosk,qwen3tts]'

# ── Auris STT engines ─────────────────────────────────────────────────────────
vosk      = ["vosk>=0.3.45"]          # local CPU STT (Auris vosk engine)
                                       # ~50 MB model downloaded on first use

# ── Real-time VAD / Live engines ──────────────────────────────────────────────
silero    = ["silero-vad>=5.1", "torch>=2.0"]   # SileroVAD (core/vad_service)
audio     = ["silero-vad>=5.1", "torch>=2.0"]   # alias: same as silero

# ── Vox TTS engines ───────────────────────────────────────────────────────────
# qwen3tts: Qwen3-TTS via Hugging Face transformers pipeline
qwen3tts  = ["transformers>=4.40", "soundfile>=0.12", "torch>=2.0"]

# kitten: Silero TTS V3 via torch.hub (CPU-capable, ~55 MB model)
kitten    = ["torch>=2.0", "soundfile>=0.12", "omegaconf>=2.3"]

# chatterbox: Resemble AI Chatterbox expressive TTS
# Note: depends on pkuseg which may require manual build steps and is not
# always available in the build environment.  This engine is therefore *not*
# included in the automatic dependency resolution; install it separately if
# you want to enable expressive local TTS.
# To add it to the Docker image, see the post-`uv sync` pip commands in
# the Dockerfile.
# chatterbox = ["chatterbox-tts>=0.1.3"]   # install manually if needed

# harmony: Harmony Speech Engine (install from GitHub until PyPI release)
# pip install git+https://github.com/harmony-speech/harmony-speech-engine.git
# harmony   = ["harmony-speech-engine"]   # NOT on PyPI – install manually

# kitten: KittenTTS (not yet on PyPI; install manually from project repo)
# kitten    = ["kittentts"]               # NOT on PyPI – install manually

# ── Meta-extras ───────────────────────────────────────────────────────────────
# Install everything needed for local audio (no cloud API keys required):
# uv pip install '.[all-audio]'
all-audio  = [
    "vosk>=0.3.45",
    "silero-vad>=5.1",
    "torch>=2.0",
    "transformers>=4.40",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "ty>=0.0.14", 
    "unittest-xml-reporting>=3.2.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ty.environment]
# "python-version" must be inside [environment], not at the top
python-version = "3.10"

[tool.ty.src]
# We explicitly list all folders containing Python code
include = [
    "core",
    "plugins",
    "interface",
    "llm_engines",
    "tests",
    "scripts",
    "automation_tools",
    "main.py"
]
