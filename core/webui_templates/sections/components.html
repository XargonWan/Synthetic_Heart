<section class="tab-panel" id="tab-components" data-tab="components" role="tabpanel">
    <div class="settings-grid" style="flex-direction: column;">
        <article class="card">
            <h2>LLM Engines</h2>
            <div id="components-llm">
                <div class="meta" id="components-llm-summary">Loading…</div>

                <div class="meta" id="components-llm-controls" style="display:flex; gap:10px; align-items:center; margin-top:10px;">
                    <select id="llm-engine-select" style="padding:10px 14px; background:var(--background); color:var(--text); border:2px solid var(--primary); border-radius:10px; font-weight:700; min-width:360px; font-size:1rem;">
                    </select>
                    <div id="llm-engine-info" class="meta" style="min-width:160px;">
                        <span id="llm-engine-model">model: –</span>
                        &nbsp;•&nbsp;
                        <span id="llm-engine-login-state">state: –</span>
                    </div>
                    <button id="llm-login-btn" class="pill">Login</button>
                </div>

                <div class="components-list" id="components-llm-list"></div>
            </div>
        </article>
        <article class="card">
            <h2>Interfaces</h2>
            <div class="components-list" id="components-interfaces-list">
                <div class="meta">Loading…</div>
            </div>
        </article>
        <article class="card">
            <h2>Plugins</h2>
            <div class="components-list" id="components-plugins-list">
                <div class="meta">Loading…</div>
            </div>
        </article>

        <article class="card" style="background: var(--background); border: 2px solid #ffc107; border-radius: 8px;">
            <h2 style="color: #ffc107;">🔧 Development Components</h2>
            <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="dev-components-toggle" style="width: 20px; height: 20px; cursor: pointer;">
                    <span style="font-weight: 500;">Enable development components (interface_dev, plugins_dev, llm_engines_dev)</span>
                </label>
            </div>
            <div class="meta" style="margin-top: 10px;">
                ⚠️ <strong>Warning:</strong> This setting is not persistent and will reset to OFF when SyntH restarts. SyntH will restart automatically after toggling.
            </div>
        </article>
    </div>
</section>
