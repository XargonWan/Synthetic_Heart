<section class="tab-panel" id="tab-plugins" data-tab="plugins" role="tabpanel">
    <div class="settings-grid" style="flex-direction: column;">
        <article class="card">
            <h2>Plugins</h2>
            <div class="plugins-search-row">
                <input type="search" id="plugins-search" class="plugins-search-input"
                    placeholder="Search plugins by name or variable…"
                    autocomplete="off" spellcheck="false" aria-label="Search plugins by name or variable" />
            </div>
            <div class="plugins-two-col" id="plugins-two-col">
                <div class="plugins-col-left" id="plugins-banner-list" role="listbox" aria-label="Plugins">
                    <div class="meta">Loading…</div>
                </div>
                <div class="plugins-col-resizer" id="plugins-col-resizer" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
                <div class="plugins-col-right" id="plugin-detail-pane">
                    <div class="plugin-detail-empty meta" id="plugin-detail-empty">
                        Select a plugin on the left to see its description, guide and settings.
                    </div>
                    <div class="plugin-detail-content" id="plugin-detail-content" hidden></div>
                </div>
            </div>
        </article>

        <article class="card" style="background: var(--background); border: 2px solid #ffc107; border-radius: 8px;">
            <h2 style="color: #ffc107;">🔧 Development Components</h2>
            <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="dev-components-toggle" style="width: 20px; height: 20px; cursor: pointer;">
                    <span style="font-weight: 500;">Enable development components (interface_dev, plugins_dev, engines/&lt;kind&gt;/dev)</span>
                </label>
            </div>
            <div class="meta" style="margin-top: 10px;">
                ⚠️ <strong>Warning:</strong> This setting is not persistent and will reset to OFF when SyntH restarts. SyntH will restart automatically after toggling.
            </div>
        </article>
    </div>
</section>

<style>
    .plugins-search-row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin: 0.2rem 0 0.9rem;
    }

    .plugins-search-row .plugins-search-input {
        flex: 1 1 auto;
        min-width: 200px;
        padding: 0.55rem 0.75rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--text);
    }

    .plugins-search-row .plugins-search-input::placeholder {
        color: var(--text-soft);
    }
</style>
