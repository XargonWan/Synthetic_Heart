<section class="tab-panel" id="tab-plugins" data-tab="plugins" role="tabpanel">
    <div class="settings-grid" style="flex-direction: column;">
        <nav class="plugins-subnav" role="tablist" aria-label="Plugins views">
            <button class="plugins-subnav-btn active" type="button" data-plugins-subtab="installed" aria-selected="true">Installed</button>
            <button class="plugins-subnav-btn" type="button" data-plugins-subtab="store" aria-selected="false">Store</button>
        </nav>

        <div class="plugins-subpanel active" id="plugins-panel-installed" data-plugins-subtab="installed">
        <article class="card">
            <h2>Plugins</h2>
            <div class="plugins-search-row">
                <input type="search" id="plugins-search" class="plugins-search-input"
                    placeholder="Search plugins by name or variable…"
                    autocomplete="off" spellcheck="false" aria-label="Search plugins by name or variable" />
            </div>
            <div class="plugins-filter-row" id="plugins-filter-row">
                <select id="plugins-filter-enabled" class="plugins-filter-select"
                    aria-label="Filter by enabled state">
                    <option value="">All states</option>
                    <option value="enabled">Enabled only</option>
                    <option value="disabled">Disabled only</option>
                </select>
                <select id="plugins-filter-status" class="plugins-filter-select"
                    aria-label="Filter by status">
                    <option value="">Any status</option>
                    <option value="green">🟢 OK</option>
                    <option value="orange">🟠 Warning</option>
                    <option value="red">🔴 Error</option>
                    <option value="grey">⚪ Inactive</option>
                </select>
                <select id="plugins-filter-category" class="plugins-filter-select"
                    aria-label="Filter by category">
                    <option value="">All categories</option>
                </select>
                <label class="plugins-filter-check" title="Only plugins that contribute to Recon">
                    <input type="checkbox" id="plugins-filter-recon" />
                    <span>Recon</span>
                </label>
                <label class="plugins-filter-check" title="Only plugins that contribute to Debrief">
                    <input type="checkbox" id="plugins-filter-debrief" />
                    <span>Debrief</span>
                </label>
                <label class="plugins-filter-check" title="Only plugins that can be run manually">
                    <input type="checkbox" id="plugins-filter-runnable" />
                    <span>Runnable</span>
                </label>
                <button type="button" id="plugins-filter-reset" class="plugins-filter-reset"
                    title="Clear all filters">Reset</button>
            </div>
            <div class="plugins-two-col" id="plugins-two-col">
                <div class="plugins-col-left" id="plugins-banner-list" role="listbox" aria-label="Plugins">
                    <div class="meta">Loading…</div>
                </div>
                <div class="plugins-col-resizer" id="plugins-col-resizer" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
                <div class="plugins-col-right" id="plugin-detail-pane">
                    <div class="plugin-detail-empty meta" id="plugin-detail-empty">
                        Select a plugin on the left to see its description, guide and settings.
                    </div>
                    <div class="plugin-detail-content" id="plugin-detail-content" hidden></div>
                </div>
            </div>
        </article>

        <article class="card" style="background: var(--background); border: 2px solid #ffc107; border-radius: 8px;">
            <h2 style="color: #ffc107;">🔧 Development Components</h2>
            <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="dev-components-toggle" style="width: 20px; height: 20px; cursor: pointer;">
                    <span style="font-weight: 500;">Enable development components (interface_dev, plugins_dev, engines/&lt;kind&gt;/dev)</span>
                </label>
            </div>
            <div class="meta" style="margin-top: 10px;">
                ⚠️ <strong>Warning:</strong> This setting is not persistent and will reset to OFF when SyntH restarts. SyntH will restart automatically after toggling.
            </div>
        </article>
        </div>

        <div class="plugins-subpanel" id="plugins-panel-store" data-plugins-subtab="store">
            <article class="card">
                <h2>Store</h2>
                <div class="plugins-store-coming-soon">Coming soon</div>
            </article>
        </div>
    </div>
</section>
