<section id="tab-home" data-tab="home" role="tabpanel" aria-labelledby="home">
    <div class="home-stage">
        <div class="home-content">
            <button id="chat-toggle" class="chat-toggle-btn" type="button" aria-label="Restore chat" title="Restore Chat" style="display:none;">💬</button>
            <section id="chat" aria-label="Chat panel">
                <div id="chat-title-bar">
                    <div class="chat-title">💬 Chat</div>
                    <div class="chat-controls">
                        <!-- WinBox header provides maximize control; no duplicate button here -->
                    </div>
                </div>
                <div id="messages" aria-live="polite"></div>
                <div class="chat-toolbar">
                    <button id="chat-archive" title="Archive current chat" type="button" class="pill">📦 Archive</button>
                    <button id="chat-restore" title="Open archives" type="button" class="pill">🗂️ Open Archive</button>
                </div>
                <form id="composer" autocomplete="off">
                    <textarea id="input" placeholder="Type a message…" rows="2"></textarea>
                    <button id="send" type="submit" disabled="disabled">➤</button>
                </form>
            </section>
            <div class="home-vrm">
                <canvas id="vrm-canvas"></canvas>
            </div>
        </div>
    </div>
    <script type="module" src="/js/vrm-viewer.mjs"></script>
</section>
