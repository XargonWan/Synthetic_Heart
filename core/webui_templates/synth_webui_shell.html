<!DOCTYPE html>
<!-- Deprecated: use synth_webui_shell_clean.html (rendered by core/webui.py). -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%%BRAND_NAME%%</title>
    <link rel="stylesheet" href="/js/vendor/winbox.min.css" />
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0d16;
            --surface: rgba(24, 24, 36, 0.9);
            --surface-alt: rgba(18, 18, 28, 0.75);
            --panel-bg: rgba(18, 18, 28, 0.92);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.18);
            --accent: #ff6bd6;
            --accent-soft: rgba(255, 107, 214, 0.16);
            --text: #f5f5ff;
            --text-soft: #b9badc;
            --success: #18c98c;
            --warn: #f3c04d;
            --error: #ff7b93;
            --log-debug: #9aa0ff;
            --log-info: #d5d8ff;
            --log-warn: #ffde85;
            --log-error: #ff9fae;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 20% 0%, rgba(114, 137, 218, 0.18), transparent 55%),
                radial-gradient(circle at 80% 100%, rgba(255, 107, 214, 0.22), transparent 55%),
                var(--bg);
            color: var(--text);
        }
        header.top-bar {
            position: sticky;
            top: 0;
            z-index: 50000;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem min(4vw, 2.4rem);
            background: linear-gradient(135deg, rgba(12, 12, 20, 0.78), rgba(34, 30, 46, 0.78));
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .brand img {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            box-shadow: 0 16px 30px -22px rgba(114, 137, 218, 0.9);
        }
        .brand-text h1 {
            margin: 0;
            font-size: 1.45rem;
            letter-spacing: 0.08em;
        }
        nav.main-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            border: 1px solid transparent;
            background: var(--surface-alt);
            color: var(--text-soft);
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .nav-btn .icon { font-size: 1.05rem; }
        .nav-btn.active {
            background: var(--accent);
            color: #07070c;
            box-shadow: 0 18px 35px -24px rgba(255, 107, 214, 0.95);
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            color: var(--text-soft);
            letter-spacing: 0.06em;
        }
        .connection-status .indicator {
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 50%;
            background: #8585a2;
        }
        .connection-status .indicator.online {
            background: var(--success);
            box-shadow: 0 0 12px rgba(24, 201, 140, 0.7);
        }
        main {
            flex: 1;
            display: flex;
            width: 100%;
            min-height: 0;
        }
        .tab-panel {
            display: none;
            width: 100%;
            height: 100%;
            min-height: calc(100vh - var(--topbar-height, 120px));
            padding: clamp(1rem, 2vw, 2rem);
        }
        .tab-panel.active {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        #tab-home { padding: 0; }
        .home-stage { height: 100%; }
        .home-content { position: relative; height: 100%; }
        #chat {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            width: 420px;
            height: 70vh;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            background: rgba(12, 12, 20, 0.9);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 24px 45px -38px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            z-index: 50;
        }
        #chat.synth-window-managed {
            position: static;
            inset: auto;
            width: 100%;
            height: 100%;
            max-height: none;
            border: none;
            border-radius: 16px;
            box-shadow: none;
            background: rgba(12, 12, 20, 0.9);
        }
        #chat.synth-window-managed #chat-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding: 0.85rem 1rem;
            background: rgba(12, 12, 20, 0.82);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        #chat.synth-window-managed #chat-title-bar {
            display: none;
        }
        #chat-title-bar .chat-title {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        #chat-title-bar .chat-controls .pill {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
        }
        .synth-minimized-stack {
            position: fixed;
            bottom: 1.2rem;
            right: auto;
            left: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            align-items: flex-start;
            z-index: 10650;
        }
        .winbox.synth-winbox .wb-title {
            color: var(--text);
        }
        .winbox.synth-winbox .wb-control {
            color: var(--text-soft);
        }
        .winbox.synth-winbox .wb-control:hover,
        .winbox.synth-winbox .wb-control:focus {
            color: var(--accent);
        }
        .winbox.synth-winbox .wb-body {
            background: rgba(12, 12, 20, 0.9);
        }
        .winbox.synth-winbox .wb-header {
            background: var(--accent);
        }
        .winbox.synth-winbox .wb-drag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 120px;
        }
        .winbox.synth-winbox .synth-wb-tools {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }
        .winbox.synth-winbox .synth-wb-tool-btn {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border-radius: 8px;
            height: 22px;
            min-width: 24px;
            padding: 0 6px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .winbox.synth-winbox .synth-wb-tool-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        #synth-advanced-debug.synth-window-managed #synth-debug-title-bar {
            display: none;
        }
        #synth-advanced-debug {
            background: var(--panel-bg);
            color: var(--text);
        }
        #archive-panel.synth-window-managed .archive-header {
            display: none;
        }
        #archive-panel {
            background: var(--panel-bg);
        }
        #archive-panel {
            color: var(--text);
        }
        #archive-panel .archive-header {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }
        #archive-panel .archive-title {
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        #archive-panel .archive-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        #archive-panel .archive-list {
            flex: 1;
            overflow: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #archive-panel .archive-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            background: rgba(255, 255, 255, 0.02);
        }
        #archive-panel .archive-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
        }
        #archive-panel .archive-check {
            display: none;
            margin-right: 6px;
            accent-color: var(--accent);
        }
        #archive-panel.archive-edit-mode .archive-check {
            display: inline-block;
        }
        #archive-panel.archive-edit-mode .archive-row {
            cursor: pointer;
        }
        #archive-panel .archive-row:hover {
            border-color: var(--border-strong);
        }
        #archive-panel .archive-row.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        #archive-panel .archive-row input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 8px;
        }
        #archive-panel .archive-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 107, 214, 0.2);
        }
        #archive-panel .empty-state {
            color: var(--text-soft);
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .bubble {
            max-width: 72ch;
            padding: 1rem 1.2rem;
            border-radius: 18px;
            line-height: 1.45;
            white-space: pre-wrap;
        }
        .bubble.user { align-self: flex-end; background: rgba(255, 255, 255, 0.08); }
        .bubble.synth { align-self: flex-start; background: linear-gradient(135deg, #ff6bd6, #7289da); color: #fff; }
        #composer {
            display: flex;
            gap: 0.8rem;
            padding: 1.1rem 1.4rem 1.4rem;
            align-items: flex-end;
        }
        #input {
            flex: 1;
            resize: none;
            border-radius: 14px;
            padding: 0.9rem 1.1rem;
            border: 1px solid var(--border);
            background: rgba(12, 12, 20, 0.58);
            color: inherit;
            font-size: 1rem;
            line-height: 1.4;
        }
        #send {
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #04040a;
            height: 2.8rem;
            width: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-vrm { width: 100%; height: 100%; }
        .settings-grid {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(1rem, 2vw, 1.6rem);
            align-items: stretch;
            width: 100%;
            overflow-y: auto;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: clamp(1.3rem, 2vw, 1.9rem);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 24px 45px -42px rgba(0, 0, 0, 0.85);
        }
        .meta { color: var(--text-soft); font-size: 0.9rem; }
        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 107, 214, 0.4);
            background: var(--accent-soft);
            color: inherit;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.45rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .logs-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: clamp(1.2rem, 2vw, 1.8rem);
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow: hidden;
        }
        #log-output {
            background: rgba(8, 8, 16, 0.82);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            overflow-y: auto;
            font-family: "JetBrains Mono", "Fira Code", monospace;
            font-size: 0.88rem;
            line-height: 1.45;
            white-space: pre-wrap;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
        }
        .log-line.level-debug { color: var(--log-debug); }
        .log-line.level-info { color: var(--log-info); }
        .log-line.level-warning { color: var(--log-warn); }
        .log-line.level-error { color: var(--log-error); }
        details.component-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0.75rem 1rem;
        }
        .component-status {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 0.15rem 0.55rem;
            color: var(--text-soft);
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .hamburger { display: block; }
            nav.main-nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(12, 12, 20, 0.95);
                border-bottom: 1px solid var(--border);
                padding: 1rem;
                flex-direction: column;
                gap: 0.8rem;
                z-index: 10600;
            }
            nav.main-nav.open { display: flex; position: fixed; bottom: 0; }
            #chat { width: calc(100% - 2rem); height: 50vh; }
        }
    </style>
